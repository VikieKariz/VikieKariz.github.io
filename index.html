<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Freemius - Sign In | Secure Access</title>
    <link rel="icon" type="image/x-icon" href="https://freemius.com/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Oxanium:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d9ff;
            --primary-light: #00ffff;
            --primary-dark: #0099cc;
            --secondary: #ff00ff;
            --accent: #ff2e63;
            --dark: #0a0a1a;
            --darker: #050510;
            --light: #ffffff;
            --glass: rgba(0, 217, 255, 0.08);
            --glass-border: rgba(0, 217, 255, 0.2);
            --success: #00ff88;
            --warning: #ffcc00;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #050510 50%, #0a0a2e 100%);
            color: var(--light);
            font-family: 'Oxanium', cursive;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .gaming-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .cyber-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 217, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .glitch-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
            animation: glitchMove 4s linear infinite;
        }

        @keyframes glitchMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .glitch-line:nth-child(1) { top: 15%; animation-delay: 0s; }
        .glitch-line:nth-child(2) { top: 50%; animation-delay: 1.5s; }
        .glitch-line:nth-child(3) { top: 85%; animation-delay: 3s; }

        .cyber-orb {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0.1;
            animation: floatOrb 12s ease-in-out infinite;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.2); }
        }

        .cyber-orb:nth-child(1) { top: 10%; left: 5%; }
        .cyber-orb:nth-child(2) { bottom: 20%; right: 10%; background: radial-gradient(circle, var(--secondary) 0%, transparent 70%); animation-delay: -4s; }

        /* Checkout Container */
        .checkout-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .checkout-card {
            max-width: 500px;
            width: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 35, 0.95), rgba(5, 5, 20, 0.98));
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(0, 217, 255, 0.4);
            box-shadow: 0 0 60px rgba(0, 217, 255, 0.25);
            overflow: hidden;
            animation: cardGlow 3s infinite alternate;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 0 30px rgba(0, 217, 255, 0.2); border-color: rgba(0, 217, 255, 0.3); }
            100% { box-shadow: 0 0 60px rgba(0, 217, 255, 0.4); border-color: rgba(255, 0, 255, 0.4); }
        }

        /* Header */
        .checkout-header {
            background: linear-gradient(135deg, #0a0a2a, #050515);
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 217, 255, 0.3);
            position: relative;
        }

        .checkout-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .logo i {
            margin-right: 8px;
            color: var(--primary);
        }

        .checkout-header p {
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Product Info */
        .product-info {
            padding: 25px 30px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(0, 217, 255, 0.15);
        }

        .product-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .product-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--light);
        }

        .product-price small {
            font-size: 0.8rem;
            color: #888;
        }

        .discount-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--warning), #ff8800);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 10px;
        }

        .security-badges {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--success);
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Sign In Section - EMAIL/PASSWORD FORM (replacing Google+Guest) */
        .signin-section {
            padding: 30px;
            border-bottom: 1px solid rgba(0, 217, 255, 0.15);
        }

        .section-title {
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
        }

        /* New email/password form styles - matching existing design language */
        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-light);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-label i {
            margin-right: 6px;
            font-size: 0.7rem;
        }

        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(0, 217, 255, 0.3);
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 0.9rem;
            font-family: 'Oxanium', cursive;
            color: var(--light);
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
            background: rgba(0, 0, 0, 0.7);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-signin-email {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 14px 20px;
            border-radius: 60px;
            border: none;
            width: 100%;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 15px;
        }

        .btn-signin-email:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .btn-google {
            background: white;
            color: #3c4043;
            padding: 12px 20px;
            border-radius: 60px;
            border: none;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Oxanium', cursive;
            margin-bottom: 12px;
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-guest {
            background: transparent;
            border: 1.5px solid rgba(0, 217, 255, 0.4);
            color: var(--primary-light);
            padding: 12px 20px;
            border-radius: 60px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-guest:hover {
            border-color: var(--primary);
            background: rgba(0, 217, 255, 0.1);
            transform: translateY(-2px);
        }

        .or-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #666;
            font-size: 0.8rem;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .or-divider::before { left: 0; }
        .or-divider::after { right: 0; }

        .signup-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.75rem;
            color: #888;
        }

        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .checkout-footer {
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.3);
            text-align: center;
            border-top: 1px solid rgba(0, 217, 255, 0.15);
            font-size: 0.7rem;
            color: #666;
        }

        .checkout-footer i {
            color: var(--primary);
            margin: 0 4px;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.98);
            backdrop-filter: blur(20px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--glass-border);
            border-top: 3px solid var(--primary);
            border-right: 3px solid var(--secondary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--success);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 10001;
            animation: fadeOut 3s forwards;
        }

        .toast-message.error {
            background: var(--accent);
            color: #fff;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        @media (max-width: 550px) {
            .checkout-card { margin: 0 15px; }
            .product-name { font-size: 1rem; }
            .product-price { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="gaming-bg">
        <div class="cyber-grid"></div>
        <div class="glitch-line"></div>
        <div class="glitch-line"></div>
        <div class="glitch-line"></div>
        <div class="cyber-orb"></div>
        <div class="cyber-orb"></div>
    </div>

    <div class="checkout-container">
        <div class="checkout-card">
            <div class="checkout-header">
                <div class="logo"><i class="fas fa-microchip"></i> FREEMIUS</div>
                <p>SECURE ACCOUNT ACCESS</p>
            </div>

            <div class="product-info">
                <div class="product-row">
                    <span class="product-name" id="productName">Freemius Dashboard</span>
                    <span class="product-price" id="productPrice">FREE <small>access</small></span>
                </div>
                <div class="security-badges">
                    <span class="security-badge"><i class="fas fa-shield-alt"></i> 256-bit SSL</span>
                    <span class="security-badge"><i class="fas fa-lock"></i> Encrypted</span>
                    <span class="security-badge"><i class="fas fa-database"></i> GDPR Compliant</span>
                </div>
            </div>

            <!-- Sign In Section -->
            <div id="signinSection" class="signin-section">
                <div class="section-title"><i class="fas fa-id-card"></i> SIGN IN TO YOUR ACCOUNT</div>
                
                <!-- Email/Password Sign In Form -->
                <form id="signinForm">
                    <div class="input-group">
                        <label class="input-label"><i class="fas fa-envelope"></i> EMAIL ADDRESS</label>
                        <input type="email" id="loginEmail" class="input-field" placeholder="cyberpunk@freemius.com" required autocomplete="email">
                    </div>
                    <div class="input-group">
                        <label class="input-label"><i class="fas fa-key"></i> PASSWORD</label>
                        <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-signin-email"><i class="fas fa-sign-in-alt"></i> SIGN IN</button>
                </form>
                
                <div class="or-divider">OR</div>
                
                <button id="googleSignInBtn" class="btn-google">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                    </svg>
                    Continue with Google
                </button>
                
                <button id="guestBtn" class="btn-guest"><i class="fas fa-user-astronaut"></i> Continue as Guest</button>
                
                <div class="signup-link">
                    Don't have an account? <a href="#" id="createAccountLink">Create Account</a>
                </div>
            </div>

            <div class="checkout-footer">
                <i class="fas fa-shield-alt"></i> SECURE CONNECTION • POWERED BY FREEMIUS <i class="fas fa-lock"></i>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div style="color: var(--primary); font-family: 'Orbitron';">AUTHENTICATING CREDENTIALS...</div>
        <div style="font-size: 0.8rem; margin-top: 10px; color: #888;">Please do not close this window</div>
    </div>

    <script>
        // GitHub Pages Authentication Flow - index.html redirects to dashboard.html
        // All original cyberpunk styling remains 100% intact
        
        // DOM Elements
        const signinSection = document.getElementById('signinSection');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const guestBtn = document.getElementById('guestBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const signinForm = document.getElementById('signinForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const createAccountLink = document.getElementById('createAccountLink');
        
        // Demo user database (in-memory for demo)
        let demoUsers = JSON.parse(localStorage.getItem('freemius_demo_users')) || [
            { email: 'demo@freemius.com', password: 'demo123', name: 'CyberGamer', avatar: 'https://randomuser.me/api/portraits/men/32.jpg' }
        ];
        
        function saveUsersToLocal() {
            localStorage.setItem('freemius_demo_users', JSON.stringify(demoUsers));
        }
        
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            if (isError) toast.classList.add('error');
            toast.style.background = isError ? '#ff2e63' : '#00ff88';
            toast.style.color = isError ? '#fff' : '#000';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Store user data and redirect to dashboard
        function authenticateAndRedirect(userData) {
            // Store user info in localStorage for dashboard to access
            localStorage.setItem('freemius_current_user', JSON.stringify(userData));
            localStorage.setItem('freemius_is_authenticated', 'true');
            
            // Show loading overlay
            loadingOverlay.style.display = 'flex';
            
            // Redirect to dashboard.html after short delay
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }
        
        // Email/Password Sign In
        signinForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = loginEmail.value.trim().toLowerCase();
            const password = loginPassword.value;
            
            if (!email || !password) {
                showToast('Please enter both email and password', true);
                return;
            }
            
            const user = demoUsers.find(u => u.email === email && u.password === password);
            
            if (user) {
                const userData = {
                    email: user.email,
                    name: user.name || user.email.split('@')[0],
                    avatar: user.avatar || 'https://randomuser.me/api/portraits/lego/1.jpg',
                    authMethod: 'email',
                    isGuest: false
                };
                authenticateAndRedirect(userData);
                loginEmail.value = '';
                loginPassword.value = '';
            } else {
                showToast('Invalid email or password. Try demo@freemius.com / demo123', true);
            }
        });
        
        // Google Sign In (demo simulation)
        googleSignInBtn.addEventListener('click', () => {
            loadingOverlay.style.display = 'flex';
            setTimeout(() => {
                const googleUser = {
                    email: 'google.user@gmail.com',
                    name: 'GooglePlayer',
                    avatar: 'https://randomuser.me/api/portraits/men/45.jpg',
                    authMethod: 'google',
                    isGuest: false
                };
                
                // Save to demo users if new
                if (!demoUsers.find(u => u.email === googleUser.email)) {
                    demoUsers.push({...googleUser, password: 'google_auth_demo'});
                    saveUsersToLocal();
                }
                
                authenticateAndRedirect(googleUser);
            }, 1500);
        });
        
        // Guest Mode
        guestBtn.addEventListener('click', () => {
            loadingOverlay.style.display = 'flex';
            setTimeout(() => {
                const guestData = {
                    email: null,
                    name: 'Guest User',
                    avatar: 'https://randomuser.me/api/portraits/lego/2.jpg',
                    authMethod: 'guest',
                    isGuest: true,
                    guestId: 'guest_' + Date.now()
                };
                authenticateAndRedirect(guestData);
            }, 1000);
        });
        
        // Create Account (demo signup)
        createAccountLink.addEventListener('click', (e) => {
            e.preventDefault();
            const newEmail = prompt('Enter email for new account:', 'new@freemius.com');
            if (newEmail && newEmail.includes('@')) {
                const newPassword = prompt('Enter password (min 4 chars):', '');
                if (newPassword && newPassword.length >= 4) {
                    const newName = prompt('Enter display name:', 'NewPlayer');
                    if (demoUsers.find(u => u.email === newEmail.toLowerCase())) {
                        showToast('Email already exists. Try signing in instead.', true);
                    } else {
                        demoUsers.push({
                            email: newEmail.toLowerCase(),
                            password: newPassword,
                            name: newName || newEmail.split('@')[0],
                            avatar: 'https://randomuser.me/api/portraits/lego/1.jpg'
                        });
                        saveUsersToLocal();
                        showToast('✓ Account created! Please sign in.');
                    }
                } else {
                    showToast('Password must be at least 4 characters', true);
                }
            } else if (newEmail) {
                showToast('Please enter a valid email address', true);
            }
        });
        
        // Check if user is already authenticated and redirect to dashboard
        const isAuthenticated = localStorage.getItem('freemius_is_authenticated') === 'true';
        if (isAuthenticated) {
            // If already logged in, redirect to dashboard
            window.location.href = 'dashboard.html';
        }
        
        // Preserve all original animations
        const card = document.querySelector('.checkout-card');
        if (card) {
            card.style.animation = 'cardGlow 3s infinite alternate';
        }
    </script>
</body>
</html>
